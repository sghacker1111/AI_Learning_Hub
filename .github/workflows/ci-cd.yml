name: AI Learning Nepal Production CI/CD Pipeline

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-typecheck:
    name: 🔍 Quality Gate (Lint & TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Typecheck
        run: npm run typecheck

      - name: Run Regression Tests
        run: npm test

      - name: Validate Prisma Schema
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Audit Production Dependencies
        run: npm audit --omit=dev --audit-level=high

  build-production:
    name: 📦 Production Build & Verification
    needs: [lint-and-typecheck]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

  docker-containerize:
    name: 🐳 Multi-Stage Docker Container Build
    needs: [build-production]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ailearningnepal/web:latest,ailearningnepal/web:${{ github.sha }}

  deployment-readiness:
    name: 🚀 Deployment Readiness Check
    needs: [docker-containerize]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm deployment integration is configured
        run: |
          echo "Container build passed. No production deployment target is configured in this repository."
          echo "Add authenticated deployment steps and real post-deployment health probes before enabling releases."
